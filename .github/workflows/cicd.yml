name: community be CI/CD

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: Create .env file
        run: |
          echo "${{ secrets.TEST_ENV_FILE }}" > .env

      - name: Export .env variables
        run: |
          set -a
          source .env
          set +a

      - name: Grant Gradle permissions
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

  build-and-push-image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: 17

      - name: Grant for Gradle
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker image
        run: |
          docker build --platform linux/amd64 -t ${{ secrets.DOCKER_USERNAME }}/community-be:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/community-be:latest
  

  deploy:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Docker if not exists
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.SERVER_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "command -v docker || (sudo apt update && sudo apt install -y docker.io && sudo systemctl enable docker && sudo systemctl start docker)"
            ]' \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EC2 with SSM
        run: |
          aws ssm send-command \
          --instance-ids ${{ secrets.SERVER_INSTANCE_ID }} \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=[
          "docker stop community-be || true",
          "docker rm community-be || true",
          "docker pull '${{ secrets.DOCKER_USERNAME }}/community-be:latest'",
          "docker run -d -p 8080:8080 --env-file /home/ubuntu/community-be.env --name community-be '${{ secrets.DOCKER_USERNAME }}/community-be:latest'"
          ]' \
          --region ${{ secrets.AWS_REGION }}